name: Security and build checks
on:
  pull_request:
  push:
    branches:
      - security/phase1-admin-auth-draft
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:security
      - run: npm run build
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit report (all packages)
        if: always()
        run: npm audit --audit-level=moderate || true
