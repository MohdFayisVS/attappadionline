name: Security and build checks
on:
  pull_request:
  push:
    branches:
      - security/phase1-admin-auth-draft
permissions:
  contents: write
jobs:
  remediate:
    if: github.head_ref == 'security/phase1-admin-auth-draft' || (github.event_name == 'push' && github.ref == 'refs/heads/security/phase1-admin-auth-draft' && !startsWith(github.event.head_commit.message, 'chore(deps):'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: security/phase1-admin-auth-draft
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pin patched gRPC dependency and apply compatible fixes
        run: |
          npm pkg set 'overrides.@grpc/grpc-js=^1.14.5'
          npm install --package-lock-only --ignore-scripts
          npm audit fix || true
      - name: Verify patched dependencies
        run: |
          npm run lint
          npm run test:security
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit verified dependency updates
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'chore(deps): apply validated compatible security fixes'
            git push origin HEAD:security/phase1-admin-auth-draft
          fi
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Evaluate compatible dependency fixes
        run: npm audit fix --dry-run --json > dependency-fix-preview.json || true
      - name: Upload compatible fix preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-fix-preview
          path: dependency-fix-preview.json
          retention-days: 7
      - run: npm run lint
      - run: npm run test:security
      - run: npm run build
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit report (all packages)
        if: always()
        run: npm audit --audit-level=moderate || true
